<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>voice-shell — 音声プロンプト</title>
<style>
  :root {
    --paper:#faf9f7;
    --ink:#14161a;
    --ink-soft:#5a6068;
    --ink-faint:#8d939b;
    --rule:#e2e0dc;
    --field:#f2f0ec;
    --signal:#a8770c;      /* 認識中 */
    --sent:#3d6b4a;        /* 送信済み */
    --hold:#8a5a3c;        /* 保留中 */
    --focus:#2b5c8a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper:#131519; --ink:#e8e6e1; --ink-soft:#9aa0a8; --ink-faint:#666c74;
      --rule:#262a30; --field:#1b1e23;
      --signal:#d4a437; --sent:#7fae8b; --hold:#c99871; --focus:#6ba3d8;
    }
  }
  :root[data-theme="dark"] {
    --paper:#131519; --ink:#e8e6e1; --ink-soft:#9aa0a8; --ink-faint:#666c74;
    --rule:#262a30; --field:#1b1e23;
    --signal:#d4a437; --sent:#7fae8b; --hold:#c99871; --focus:#6ba3d8;
  }
  :root[data-theme="light"] {
    --paper:#faf9f7; --ink:#14161a; --ink-soft:#5a6068; --ink-faint:#8d939b;
    --rule:#e2e0dc; --field:#f2f0ec;
    --signal:#a8770c; --sent:#3d6b4a; --hold:#8a5a3c; --focus:#2b5c8a;
  }

  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body {
    margin:0; background:var(--paper); color:var(--ink);
    font-family:"Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    font-size:16px; line-height:1.75;
  }
  .page { max-width:53rem; margin:0 auto; padding:2.5rem 1.5rem 4rem; }

  /* ── ヘッダ ───────────────────────────── */
  header { border-bottom:1px solid var(--rule); padding-bottom:1rem; margin-bottom:1.75rem; }
  .title-row { display:flex; align-items:baseline; gap:.9rem; flex-wrap:wrap; }
  h1 { margin:0; font-size:1.05rem; font-weight:600; letter-spacing:.01em; }
  .state {
    display:flex; align-items:center; gap:.45rem;
    font-size:.75rem; color:var(--ink-soft); font-variant-numeric:tabular-nums;
  }
  /* 状態ごとに色を分ける。以前は「ためる」「送らない」「切断」が
     すべて同じ褐色で、見ても区別がつかなかった */
  .beacon { width:7px; height:7px; border-radius:50%; background:var(--ink-faint); flex:none; }
  .beacon.live { background:var(--sent); }                                    /* 届いている */
  .beacon.hold { background:var(--hold); }                                    /* 溜めている */
  .beacon.off  { background:transparent; box-shadow:inset 0 0 0 1.5px var(--ink-faint); }
  .beacon.down { background:transparent; box-shadow:inset 0 0 0 1.5px var(--signal); }
  @media (prefers-reduced-motion:no-preference) {
    .beacon.live { animation:breathe 2.4s ease-in-out infinite; }
  }
  @keyframes breathe { 50% { opacity:.35; } }
  /* 画面切替タブ（発話 / 辞書） */
  .views { display:flex; gap:.2rem; margin:.8rem 0 -1rem; }
  .view-tab {
    font-size:.85rem; padding:.35rem .95rem;
    background:transparent; color:var(--ink-faint);
    border:1px solid transparent; border-bottom:2px solid transparent;
    border-radius:0;
  }
  .view-tab:hover { color:var(--ink-soft); border-color:transparent; }
  .view-tab.on {
    color:var(--ink); font-weight:600; border-bottom-color:var(--focus);
  }

  /* ── 認識中 ───────────────────────────── */
  .now {
    display:grid; grid-template-columns:5.5rem 1fr; gap:1rem;
    padding:1rem 0; min-height:4.5rem; align-items:start;
    border-bottom:1px solid var(--rule);
  }
  .now .gutter {
    font-family:ui-monospace, "SF Mono", Menlo, monospace;
    font-size:.68rem; letter-spacing:.08em; text-transform:uppercase;
    color:var(--signal); padding-top:.35rem;
  }
  .now .stream { font-size:1.06rem; }
  .now.idle .stream { color:var(--ink-faint); }
  .caret {
    display:inline-block; width:1px; height:1.05em; background:var(--signal);
    margin-left:2px; vertical-align:-.14em;
  }
  @media (prefers-reduced-motion:no-preference) {
    .caret { animation:blink 1.1s step-end infinite; }
  }
  @keyframes blink { 50% { opacity:0; } }
  .now.idle .caret { display:none; }
  /* 何も聞こえていないときに空行に見えないようにする */
  .quiet { display:none; color:var(--ink-faint); font-size:.9rem; }
  .now.idle .quiet { display:inline; }

  /* ── 保留トレイ ───────────────────────── */
  .tray { padding:1.25rem 0; border-bottom:1px solid var(--rule); }
  .tray-head {
    font-family:ui-monospace, "SF Mono", Menlo, monospace;
    font-size:.68rem; letter-spacing:.09em; text-transform:uppercase;
    color:var(--hold); margin-bottom:.7rem;
  }
  textarea {
    display:block; width:100%; min-height:6.5rem; padding:.85rem .95rem;
    font:inherit; font-size:.98rem; line-height:1.7;
    color:var(--ink); background:var(--field);
    border:1px solid var(--rule); border-radius:2px;
    resize:none;        /* 内容に合わせて自動で伸ばすので手動リサイズは不要 */
    overflow:hidden;    /* 内側にスクロールバーを出さない */
  }
  textarea:focus-visible { outline:2px solid var(--focus); outline-offset:1px; }
  .tray-actions { display:flex; gap:.5rem; margin-top:.7rem; }

  /* ── 操作 ─────────────────────────────── */
  .bar {
    display:flex; align-items:center; gap:.6rem; flex-wrap:wrap;
    padding:1rem 0; border-bottom:1px solid var(--rule);
  }
  .bar .spacer { flex:1; }
  .tally {
    font-family:ui-monospace, "SF Mono", Menlo, monospace;
    font-size:.72rem; color:var(--ink-faint); font-variant-numeric:tabular-nums;
  }
  button {
    font:inherit; font-size:.82rem; line-height:1.4; cursor:pointer;
    padding:.42rem .9rem; border-radius:3px;
    color:var(--ink); background:var(--field); border:1px solid var(--rule);
    transition:background .12s, border-color .12s, color .12s;
  }
  button:hover { border-color:var(--ink-faint); }
  button:focus-visible { outline:2px solid var(--focus); outline-offset:2px; }

  /* 音声の届け先。3つは排他なので、選択中の位置で状態が分かる。
     （2つのトグルだと「切りつつ溜める」という存在しない状態が見えてしまう） */
  .route { display:flex; gap:.15rem; }
  .seg {
    display:inline-flex; align-items:center; gap:.4rem;
    font-size:.82rem; padding:.35rem .85rem;
    background:transparent; color:var(--ink-faint);
    border:1px solid transparent; border-bottom:2px solid transparent;
    border-radius:0;
  }
  .seg:hover { color:var(--ink-soft); border-color:transparent; }
  .seg .seg-dot {
    width:7px; height:7px; border-radius:50%; flex:none;
    box-shadow:inset 0 0 0 1.5px currentColor;   /* 非選択は輪だけ */
  }
  .seg.on { color:var(--ink); font-weight:600; }
  .seg.on .seg-dot { background:currentColor; box-shadow:none; }
  #segLive.on { color:var(--sent); border-bottom-color:var(--sent); }
  #segHold.on { color:var(--hold); border-bottom-color:var(--hold); }
  #segOff.on  { color:var(--ink-soft); border-bottom-color:var(--ink-faint); }

  button.go { border-color:var(--sent); color:var(--sent); font-weight:600; }

  .hint {
    margin:.75rem 0 0; font-size:.78rem; color:var(--ink-soft); min-height:1.2em;
  }
  .toggle {
    display:inline-flex; align-items:center; gap:.4rem;
    font-size:.79rem; color:var(--ink-soft); cursor:pointer;
  }
  .toggle input { accent-color:var(--focus); cursor:pointer; margin:0; }

  /* 使うマイク。切り替えても録音だけ入れ替わるので待たされない */
  .mic {
    font:inherit; font-size:.79rem; max-width:14rem;
    padding:.3rem .5rem; border-radius:2px;
    color:var(--ink-soft); background:var(--field); border:1px solid var(--rule);
  }
  .mic:focus-visible { outline:2px solid var(--focus); outline-offset:1px; }

  /* ── ユーザー辞書 ─────────────────────── */
  /* 開くとログと入れ替わる（重ねない・浮かせない） */
  .dict { padding:.5rem 0 1.25rem; }
  .dict-head {
    font-family:ui-monospace, "SF Mono", Menlo, monospace;
    font-size:.68rem; letter-spacing:.09em; text-transform:uppercase;
    color:var(--focus); margin-bottom:.9rem;
  }
  .dict-label {
    display:block; font-size:.78rem; color:var(--ink-soft); margin:0 0 .7rem;
  }
  /* 共有 / 手元だけ の切替 */
  .scope-row {
    display:flex; align-items:center; gap:.7rem; flex-wrap:wrap;
    padding:.5rem 0 .8rem; border-bottom:1px solid var(--rule); margin-bottom:.8rem;
  }
  .scope-note { font-size:.76rem; color:var(--ink-faint); }

  .dict-tabs { display:flex; gap:.4rem; margin-bottom:.9rem; }
  .tab {
    font-size:.79rem; padding:.3rem .8rem;
    background:transparent; color:var(--ink-soft); border-color:transparent;
    border-bottom:2px solid transparent; border-radius:0;
  }
  .tab.on { color:var(--ink); border-bottom-color:var(--focus); font-weight:600; }

  /* 追加欄は上に固定。長い一覧を下までスクロールしなくてよい */
  .new-row {
    display:flex; align-items:center; gap:.5rem; margin-bottom:.5rem;
    padding-bottom:.6rem; border-bottom:1px dashed var(--rule);
  }
  .new-row input {
    flex:1; min-width:0; font:inherit; font-size:.92rem;
    padding:.4rem .6rem; border-radius:2px;
    color:var(--ink); background:var(--field); border:1px solid var(--focus);
  }
  .new-row button { flex:none; border-color:var(--sent); color:var(--sent); font-weight:600; }

  .filter {
    display:block; width:100%; font:inherit; font-size:.85rem;
    padding:.3rem .55rem; margin-bottom:.5rem; border-radius:2px;
    color:var(--ink); background:var(--field); border:1px solid var(--rule);
  }

  /* 1件 = 1行。行数が多いので詰めて、一覧側だけスクロールさせる */
  .rows {
    display:flex; flex-direction:column; gap:.15rem;
    max-height:15rem; overflow-y:auto;
  }
  .row { display:flex; align-items:center; gap:.4rem; }
  .row input {
    flex:1; min-width:0; font:inherit; font-size:.88rem;
    padding:.2rem .45rem; border-radius:2px;
    color:var(--ink); background:transparent; border:1px solid transparent;
  }
  .row input:hover { border-color:var(--rule); }
  .row input:focus { background:var(--field); border-color:var(--rule); }
  .row.hit input { background:var(--field); }
  .row input:focus-visible { outline:2px solid var(--focus); outline-offset:1px; }
  .row .arrow { color:var(--ink-faint); font-size:.9rem; flex:none; }
  .row .del {
    flex:none; padding:.25rem .5rem; font-size:.8rem; line-height:1;
    color:var(--ink-faint); border-color:transparent; background:transparent;
  }
  .row .del:hover { color:var(--hold); border-color:var(--rule); }
  .add {
    margin-top:.6rem; font-size:.79rem;
    background:transparent; color:var(--ink-soft); border-style:dashed;
  }
  /* 組み込みで無視している語。編集できないので淡く出す */
  .builtin-head { margin-top:1.3rem; padding-top:1rem; border-top:1px solid var(--rule); }
  .chips { display:flex; flex-wrap:wrap; gap:.3rem; }
  .chip {
    font-size:.78rem; padding:.15rem .5rem; border-radius:2px;
    color:var(--ink-soft); background:var(--field); border:1px solid var(--rule);
  }

  .dict-actions {
    display:flex; gap:.5rem; align-items:center; margin-top:1rem; flex-wrap:wrap;
  }
  .dict-actions .spacer { flex:1; }
  .dict-note { margin:.6rem 0 0; font-size:.76rem; color:var(--ink-soft); min-height:1.2em; }

  /* ── 発話ログ ─────────────────────────── */
  #log { display:flex; flex-direction:column-reverse; }
  .entry {
    display:grid; grid-template-columns:5.5rem 1fr; gap:1rem;
    padding:.85rem 0; border-bottom:1px solid var(--rule);
  }
  @media (prefers-reduced-motion:no-preference) {
    .entry { animation:settle .3s ease-out; }
  }
  @keyframes settle { from { opacity:0; transform:translateY(-3px); } }
  .entry .gutter {
    font-family:ui-monospace, "SF Mono", Menlo, monospace;
    font-size:.7rem; color:var(--ink-faint);
    font-variant-numeric:tabular-nums; padding-top:.3rem;
    display:flex; flex-direction:column; gap:.2rem;
  }
  .mark { font-size:.62rem; letter-spacing:.07em; }
  .mark.sent { color:var(--sent); }
  .mark.edited { color:var(--focus); }
  .entry .text { white-space:pre-wrap; overflow-wrap:anywhere; }

  .none { padding:1.5rem 0; color:var(--ink-faint); font-size:.86rem; }

  @media (max-width:34rem) {
    .now, .entry { grid-template-columns:1fr; gap:.25rem; }
    .entry .gutter, .now .gutter { flex-direction:row; gap:.6rem; padding-top:0; }
  }
</style>
</head>
<body>
<div class="page">

  <header>
    <div class="title-row">
      <h1>voice-shell</h1>
      <span class="state"><span class="beacon" id="beacon"></span><span id="stateText">接続中</span></span>
    </div>
    <nav class="views" role="tablist">
      <button class="view-tab on" id="viewSpeech" role="tab">発話</button>
      <button class="view-tab" id="viewDict" role="tab">辞書</button>
    </nav>
  </header>

<!-- ── 発話 ─────────────────────────────── -->
<div id="speechView">

  <section class="now idle" id="now" aria-live="polite">
    <div class="gutter">認識中</div>
    <div class="stream"><span id="stream"></span><span class="caret"></span><span class="quiet" id="quiet">（無音）</span></div>
  </section>

  <section class="tray" id="tray" hidden>
    <div class="tray-head">ためています — 送る前に直せます</div>
    <textarea id="draft" aria-label="送る前のテキスト"></textarea>
    <div class="tray-actions">
      <button class="go" id="send">Claude に送る</button>
      <button id="discard">消す</button>
    </div>
  </section>

  <div class="bar">
    <div class="route" role="radiogroup" aria-label="音声の届け先">
      <button class="seg on" id="segLive" role="radio" aria-checked="true">
        <span class="seg-dot" aria-hidden="true"></span>直接送る
      </button>
      <button class="seg" id="segHold" role="radio" aria-checked="false">
        <span class="seg-dot" aria-hidden="true"></span>ためて送る
      </button>
      <button class="seg" id="segOff" role="radio" aria-checked="false">
        <span class="seg-dot" aria-hidden="true"></span>送らない
      </button>
    </div>
    <span class="spacer"></span>
    <select id="mic" class="mic" aria-label="使うマイク"></select>
    <label class="toggle"><input type="checkbox" id="clean">「えーと」を消す</label>
    <span class="tally"><span id="count">0</span> 件</span>
    <button id="copy">全部コピー</button>
  </div>
  <p class="hint" id="hint"></p>

  <div id="log"></div>
  <p class="none" id="none">まだ何も送っていません。話すとここに出ます。</p>

</div><!-- /speechView -->

<!-- ── 辞書 ─────────────────────────────── -->
  <section class="dict" id="dict" hidden>
    <div class="scope-row">
      <label class="toggle">
        <input type="checkbox" id="scopePrivate">
        手元だけに保存する（公開しない）
      </label>
      <span class="scope-note" id="scopeNote"></span>
    </div>

    <div class="dict-tabs" role="tablist">
      <button class="tab on" id="tabReplace" role="tab">言い換え</button>
      <button class="tab" id="tabIgnore" role="tab">無視する発話</button>
    </div>

    <!-- 言い換え -->
    <div class="pane" id="paneReplace">
      <p class="dict-label">送る前に置き換えます。</p>
      <div class="new-row">
        <input id="newFrom" placeholder="聞こえた語">
        <span class="arrow">→</span>
        <input id="newTo" placeholder="送る語">
        <button id="addReplace">追加</button>
      </div>
      <input class="filter" id="filterReplace" placeholder="絞り込み（登録済みを探す）">
      <div class="rows" id="replaceRows"></div>
    </div>

    <!-- 無視する発話 -->
    <div class="pane" id="paneIgnore" hidden>
      <p class="dict-label">この語だけの発話は送りません。</p>
      <div class="new-row">
        <input id="newIgnore" placeholder="この語だけなら送らない">
        <button id="addIgnore">追加</button>
      </div>
      <div class="rows" id="ignoreRows"></div>

      <p class="dict-label builtin-head">
        最初から無視している語（<span id="builtinCount">0</span>）— 登録は不要です
      </p>
      <div class="chips" id="builtinChips"></div>
    </div>

    <div class="dict-actions">
      <button class="go" id="dictSave">保存する</button>
      <span class="spacer"></span>
      <button id="dictExport">CSV で保存</button>
      <button id="dictImport">CSV を読み込む</button>
      <input type="file" id="dictFile" accept=".csv,text/csv" hidden>
    </div>
    <p class="dict-note" id="dictNote"></p>
  </section>

</div>

<script>
// 画面に出ない不具合を見えるようにする（読み込み失敗はボタンが無反応になるだけなので）
window.addEventListener('error', e => {
  const box = document.getElementById('hint');
  if (box) box.textContent = '画面の読み込みでエラー: ' + e.message;
});

const $ = id => document.getElementById(id);
const el = {};
for (const id of ['beacon','stateText','now','stream','tray','draft','send','discard',
                  'segLive','segHold','segOff','hint','clean','count','copy','log','none','mic',
                  'dict','speechView','viewSpeech','viewDict','dictSave','dictNote',
                  'tabReplace','tabIgnore','paneReplace','paneIgnore',
                  'replaceRows','ignoreRows','addReplace','addIgnore',
                  'dictExport','dictImport','dictFile',
                  'builtinChips','builtinCount',
                  'newFrom','newTo','newIgnore','filterReplace',
                  'scopePrivate','scopeNote'])
  el[id] = $(id);


/* ── 整形 ───────────────────────────────── */
const FILLERS = ['えーと','えっと','ええと','あのー','あの','えー','えっ','まあ',
                 'なんか','そのー','うーん','んー'];
const FILLER_RE = new RegExp('(' + FILLERS.sort((a,b)=>b.length-a.length)
  .map(s => s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|') + ')','g');

// 日本語モードで英語を話すと単語ごとに読点が入るため戻す
const fixLatin = t => t.replace(/([A-Za-z])、(?=[A-Za-z])/g,'$1 ');

const stripFillers = t => t.replace(FILLER_RE,'')
  .replace(/、{2,}/g,'、').replace(/^[、。\s]+/,'').replace(/\s{2,}/g,' ').trim();

const format = raw => el.clean.checked ? stripFillers(fixLatin(raw)) : fixLatin(raw);

/* ── 表示 ───────────────────────────────── */
function setState(kind, text) {
  el.beacon.className = 'beacon ' + kind;
  el.stateText.textContent = text;
}

function retally() {
  const n = el.log.children.length;
  el.count.textContent = n;
  el.none.hidden = n > 0;
}

function addEntry(rec) {
  const row = document.createElement('div');
  row.className = 'entry';

  const gutter = document.createElement('div');
  gutter.className = 'gutter';
  const stamp = document.createElement('span');
  // ログには時刻を載せていないので、受け取った時刻を表示する
  stamp.textContent = rec.time ||
    new Date().toLocaleTimeString('ja-JP', {hour12:false});
  const mark = document.createElement('span');
  mark.className = 'mark ' + (rec.edited ? 'edited' : 'sent');
  mark.textContent = rec.edited ? '直して送信' : '送信済み';
  gutter.append(stamp, mark);

  const text = document.createElement('div');
  text.className = 'text';
  text.dataset.raw = rec.text;
  text.textContent = format(rec.text);

  row.append(gutter, text);
  el.log.appendChild(row);
  retally();
}

function reformatAll() {
  for (const row of el.log.children) {
    const t = row.querySelector('.text');
    t.textContent = format(t.dataset.raw);
  }
}

/* ── 通信 ───────────────────────────────── */
function connect() {
  const ws = new WebSocket(`ws://${location.host}/ws`);

  ws.onopen = () => refreshState();

  ws.onmessage = ev => {
    const m = JSON.parse(ev.data);

    if ('partial' in m) {
      const t = m.partial.trim();
      el.stream.textContent = t;
      el.now.classList.toggle('idle', !t);

    } else if ('held' in m) {
      // 一時停止中の発話。編集中でも壊さないよう末尾に足すだけにする
      appendHeld(m.held);

    } else {
      addEntry(m);
      el.stream.textContent = '';
      el.now.classList.add('idle');
    }
  };

  ws.onclose = () => {
    setState('down', '切断 — 再接続中');
    setTimeout(connect, 2000);
  };
}

// 内容に合わせて高さを伸ばす（内側スクロールを避ける）
function grow() {
  el.draft.style.height = 'auto';
  el.draft.style.height = el.draft.scrollHeight + 'px';
}

// 保留発話を末尾に足す。カーソル位置と編集内容は保つ。
function appendHeld(text) {
  text = (text || '').trim();
  if (!text) return;
  // ためるモードでないときに来た分でトレイを開かない（説明のつかない表示になる）
  if (route !== 'hold') return;
  el.tray.hidden = false;
  const cur = el.draft.value;
  el.draft.value = cur ? cur.replace(/\s*$/, '') + '\n' + text : text;
  grow();
  // 追記直後は末尾が見えるようにする（編集中でなければ）
  if (document.activeElement !== el.draft) {
    el.draft.scrollTop = el.draft.scrollHeight;
  }
}

// 音声の届け先。3つのうち1つだけが有効。
// デーモンはミュート中に hold の判定へ進まないので、「切りつつ溜める」は存在しない。
const ROUTE = {
  live: {muted: false, paused: false},
  hold: {muted: false, paused: true},
  off:  {muted: true,  paused: false},
};
const HINT = {
  live: '話すとそのまま Claude Code に届きます。',
  hold: '話した分は下に溜まります。直してから「Claude に送る」。',
  off:  '話しても何も記録されません。通話中や別作業のときに。',
};
const STATUS = {
  live: 'Claude に届いています',
  hold: 'ためています',
  off:  '送っていません',
};
const TITLE = {live: '● 送信中', hold: '◐ ためています', off: '○ 送りません'};

let route = 'live';
let inFlight = false;   // 切替中はポーリングに巻き戻されないようにする

function paint() {
  const segs = {live: el.segLive, hold: el.segHold, off: el.segOff};
  for (const [k, b] of Object.entries(segs)) {
    b.classList.toggle('on', route === k);
    b.setAttribute('aria-checked', String(route === k));
  }
  setState(route, STATUS[route]);
  el.hint.textContent = HINT[route];
  // 端末で作業している間はタブのタイトルだけが手がかりになる
  document.title = TITLE[route] + ' — voice-shell';

  el.now.classList.toggle('idle', route === 'off');
  if (route === 'off') el.stream.textContent = '';
}

async function setRoute(next) {
  const prev = route;
  route = next;
  paint();                            // 押した瞬間に反映する
  inFlight = true;
  try {
    const w = ROUTE[next];
    // 溜め始める前にミュートを解き、切るときは溜めも止める
    await post('/api/pause', {paused: w.paused});
    await post('/api/mute', {muted: w.muted});
  } catch (err) {
    route = prev;
    paint();
    el.hint.textContent = '切替に失敗しました: ' + err.message;
    return;
  } finally {
    inFlight = false;
  }
  refreshState();
}

el.segLive.onclick = () => setRoute('live');
el.segHold.onclick = () => setRoute('hold');
el.segOff.onclick = () => setRoute('off');

// 使うマイク。切り替えても録音プロセスだけ入れ替わる（モデルはそのまま）
async function loadMics() {
  try {
    const d = await (await fetch('/api/mics')).json();
    if (!d.mics.length) { el.mic.hidden = true; return; }
    el.mic.replaceChildren(...d.mics.map(m => {
      const o = document.createElement('option');
      o.value = m.id;
      o.textContent = m.label;
      o.selected = m.id === d.current;
      return o;
    }));
    // 一覧に無いものが選ばれている場合も表示に出す
    if (d.current && ![...el.mic.options].some(o => o.value === d.current)) {
      const o = document.createElement('option');
      o.value = d.current; o.textContent = d.current; o.selected = true;
      el.mic.prepend(o);
    }
    el.mic.hidden = false;
  } catch {
    el.mic.hidden = true;
  }
}

el.mic.onchange = async () => {
  await fetch('/api/mics', {
    method: 'PUT', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({device: el.mic.value})
  });
  el.hint.textContent = `マイクを切り替えました: ${el.mic.selectedOptions[0].textContent}`;
  setTimeout(() => { el.hint.textContent = HINT[route]; }, 2500);
};

let seeded = false;   // 溜まっていた分をリロード時に一度だけ復元する

async function refreshState() {
  if (inFlight) return;               // 切替中は上書きしない
  try {
    const s = await (await fetch('/api/state')).json();
    route = s.muted ? 'off' : (s.paused ? 'hold' : 'live');
    paint();

    // リロードで溜めた分が消えないように復元する（入力中は触らない）
    if (!seeded && Array.isArray(s.held) && s.held.length && !el.draft.value.trim()) {
      el.draft.value = s.held.map(r => r.text).join('\n');
      el.tray.hidden = false;
      grow();
    }
    seeded = true;

    if (route === 'hold') {
      el.tray.hidden = false;
      grow();
    } else if (!el.draft.value.trim()) {
      el.tray.hidden = true;
    }
  } catch {
    setState('down', 'つながっていません — 再接続中');
    el.hint.textContent = '';
  }
}

const post = (path, body) =>
  fetch(path, {method:'POST', headers:{'Content-Type':'application/json'},
               body: JSON.stringify(body || {})});

/* ── 操作 ───────────────────────────────── */
el.send.onclick = async () => {
  const text = el.draft.value.trim();
  if (!text) return;
  await post('/api/send', {text});
  el.draft.value = '';
  grow();
  el.tray.hidden = route !== 'hold';   // ためている間はトレイを残す
};

// 消したものは一度だけ戻せるようにする（確認ダイアログは毎回だと煩わしい）
let lastDiscarded = '';

el.discard.onclick = async () => {
  lastDiscarded = el.draft.value;
  await post('/api/discard');
  el.draft.value = '';
  grow();
  el.tray.hidden = route !== 'hold';
  if (lastDiscarded.trim()) {
    el.hint.textContent = '消しました。';
    const undo = document.createElement('button');
    undo.textContent = '元に戻す';
    undo.style.marginLeft = '.5rem';
    undo.onclick = () => {
      el.draft.value = lastDiscarded;
      el.tray.hidden = false;
      grow();
      el.hint.textContent = HINT[route];
    };
    el.hint.appendChild(undo);
  }
};

el.draft.addEventListener('input', grow);

el.clean.onchange = reformatAll;

/* ── ユーザー辞書 ───────────────────────── */
// 1件 = 1行のフォーム。矢印や JSON を手で書かせない。

function replaceRow(from = '', to = '') {
  const row = document.createElement('div');
  row.className = 'row';
  row.innerHTML =
    '<input class="from" placeholder="聞こえた語（例: クロードコード）">' +
    '<span class="arrow">→</span>' +
    '<input class="to" placeholder="送る語（例: Claude Code）">' +
    '<button class="del" title="この行を削除" aria-label="この行を削除">✕</button>';
  row.querySelector('.from').value = from;
  row.querySelector('.to').value = to;
  row.querySelector('.del').onclick = () => row.remove();
  return row;
}

function ignoreRow(word = '') {
  const row = document.createElement('div');
  row.className = 'row';
  row.innerHTML =
    '<input class="word" placeholder="この語だけなら送らない（例: チャンネル登録）">' +
    '<button class="del" title="この行を削除" aria-label="この行を削除">✕</button>';
  row.querySelector('.word').value = word;
  row.querySelector('.del').onclick = () => row.remove();
  return row;
}

function renderDict(d) {
  el.replaceRows.replaceChildren(
    ...Object.entries(d.replace || {}).map(([k, v]) => replaceRow(k, v)));
  el.ignoreRows.replaceChildren(
    ...(d.ignore || []).map(w => ignoreRow(w)));

  // 組み込みで無視している語は編集できないので、見るだけの並びにする
  if (d.builtin) {
    el.builtinChips.replaceChildren(...d.builtin.map(w => {
      const s = document.createElement('span');
      s.className = 'chip';
      s.textContent = w;
      return s;
    }));
    el.builtinCount.textContent = d.builtin.length;
  }
  // 空なら1行だけ用意しておく（いきなり入力できるように）
  if (!el.replaceRows.children.length) el.replaceRows.appendChild(replaceRow());
  if (!el.ignoreRows.children.length) el.ignoreRows.appendChild(ignoreRow());
}

// 画面の入力欄から辞書データを組み立てる
function collectDict() {
  const replace = {};
  for (const row of el.replaceRows.children) {
    const from = row.querySelector('.from').value.trim();
    const to = row.querySelector('.to').value.trim();
    if (from && to) replace[from] = to;
  }
  const ignore = [...el.ignoreRows.children]
    .map(r => r.querySelector('.word').value.trim()).filter(Boolean);
  return {ignore, replace};
}

function showTab(which) {
  const isReplace = which === 'replace';
  el.paneReplace.hidden = !isReplace;
  el.paneIgnore.hidden = isReplace;
  el.tabReplace.classList.toggle('on', isReplace);
  el.tabIgnore.classList.toggle('on', !isReplace);
}

el.tabReplace.onclick = () => showTab('replace');
el.tabIgnore.onclick = () => showTab('ignore');

// 共有辞書 / 手元だけの辞書
const scopeQuery = () => el.scopePrivate.checked ? '?scope=private' : '';

async function loadDict() {
  renderDict(await (await fetch('/api/dictionary' + scopeQuery())).json());
  el.scopeNote.textContent = el.scopePrivate.checked
    ? '~/.config/voice-shell/dictionary.private.json（リポジトリに入りません）'
    : '~/.config/voice-shell/dictionary.json（既定値として共有できます）';
}

el.scopePrivate.onchange = async () => {
  await loadDict();
  el.dictNote.textContent = '';
};

// 画面ごと入れ替える（発話 ⇄ 辞書）
async function showView(which) {
  const dict = which === 'dict';
  if (dict) {
    await loadDict();
    el.dictNote.textContent = '';
    showTab('replace');
    el.newFrom.focus();
  }
  el.dict.hidden = !dict;
  el.speechView.hidden = dict;
  el.viewDict.classList.toggle('on', dict);
  el.viewSpeech.classList.toggle('on', !dict);
  window.scrollTo(0, 0);
}

el.viewSpeech.onclick = () => showView('speech');
el.viewDict.onclick = () => showView('dict');

// 追加は一覧の先頭に入れる（下までスクロールしなくてよい）
function addReplaceEntry() {
  const from = el.newFrom.value.trim(), to = el.newTo.value.trim();
  if (!from || !to) { el.newFrom.focus(); return; }
  el.replaceRows.prepend(replaceRow(from, to));
  el.newFrom.value = el.newTo.value = '';
  el.newFrom.focus();
  el.dictNote.textContent = '「保存する」を押すと有効になります。';
}

function addIgnoreEntry() {
  const w = el.newIgnore.value.trim();
  if (!w) return;
  el.ignoreRows.prepend(ignoreRow(w));
  el.newIgnore.value = '';
  el.newIgnore.focus();
  el.dictNote.textContent = '「保存する」を押すと有効になります。';
}

el.addReplace.onclick = addReplaceEntry;
el.addIgnore.onclick = addIgnoreEntry;

// Enter で追加できるようにする（続けて何件も入れられる）
for (const [input, fn] of [[el.newFrom, addReplaceEntry], [el.newTo, addReplaceEntry],
                           [el.newIgnore, addIgnoreEntry]]) {
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); fn(); }
  });
}

// 絞り込み（登録済みを探す）
el.filterReplace.addEventListener('input', () => {
  const q = el.filterReplace.value.trim().toLowerCase();
  for (const row of el.replaceRows.children) {
    const text = row.querySelector('.from').value + ' ' + row.querySelector('.to').value;
    const hit = q && text.toLowerCase().includes(q);
    row.hidden = q && !hit;
    row.classList.toggle('hit', !!hit);
  }
});

el.dictSave.onclick = async () => {
  const d = collectDict();
  await fetch('/api/dictionary' + scopeQuery(), {
    method: 'PUT', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(d)
  });
  const where = el.scopePrivate.checked ? '手元だけに' : '共有辞書に';
  el.dictNote.textContent =
    `${where}保存しました（言い換え ${Object.keys(d.replace).length} 件 / ` +
    `無視 ${d.ignore.length} 件）。次の発話から効きます。`;
};

/* ── CSV ─────────────────────────────────
   1行1件。列は type,from,to
     replace,クロードコード,Claude Code
     ignore,チャンネル登録,
*/
const csvCell = s => /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;

el.dictExport.onclick = () => {
  const d = collectDict();
  const lines = ['type,from,to'];
  for (const [k, v] of Object.entries(d.replace)) lines.push(`replace,${csvCell(k)},${csvCell(v)}`);
  for (const w of d.ignore) lines.push(`ignore,${csvCell(w)},`);
  // Excel が UTF-8 と分かるよう BOM を付ける
  const blob = new Blob(['﻿' + lines.join('\n') + '\n'], {type: 'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'voice-shell-dictionary.csv';
  a.click();
  URL.revokeObjectURL(a.href);
};

// 引用符つきセルも扱える簡易パーサ
function parseCsvLine(line) {
  const out = [];
  let cur = '', quoted = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (quoted) {
      if (c === '"' && line[i + 1] === '"') { cur += '"'; i++; }
      else if (c === '"') quoted = false;
      else cur += c;
    } else if (c === '"') quoted = true;
    else if (c === ',') { out.push(cur); cur = ''; }
    else cur += c;
  }
  out.push(cur);
  return out.map(s => s.trim());
}

el.dictImport.onclick = () => el.dictFile.click();

el.dictFile.onchange = async ev => {
  const file = ev.target.files[0];
  if (!file) return;
  const text = (await file.text()).replace(/^﻿/, '');

  const replace = {}, ignore = [];
  let skipped = 0;
  for (const raw of text.split(/\r?\n/)) {
    if (!raw.trim()) continue;
    const [type, from, to] = parseCsvLine(raw);
    if (/^type$/i.test(type)) continue;            // 見出し行
    if (type === 'replace' && from && to) replace[from] = to;
    else if (type === 'ignore' && from) ignore.push(from);
    else skipped++;
  }

  renderDict({replace, ignore});
  el.dictFile.value = '';                          // 同じファイルを選び直せるように
  el.dictNote.textContent =
    `読み込みました（言い換え ${Object.keys(replace).length} 件 / 無視 ${ignore.length} 件` +
    (skipped ? ` / 読めない行 ${skipped} 件` : '') + '）。「保存する」で確定します。';
};

el.copy.onclick = async ev => {
  const lines = [...el.log.children].map(r => r.querySelector('.text').textContent);
  if (!lines.length) return;
  await navigator.clipboard.writeText(lines.reverse().join('\n'));
  const b = ev.currentTarget, was = b.textContent;
  b.textContent = 'コピーしました';
  setTimeout(() => { b.textContent = was; }, 1300);
};

// Ctrl+Enter で送信
el.draft.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); el.send.click(); }
});

retally();
loadMics();
connect();
setInterval(refreshState, 3000);
</script>
</body>
</html>
