<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>voice-shell — 音声プロンプト</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%20%3Cdefs%3E%20%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%20%3Cstop%20offset%3D%220%22%20stop-color%3D%22%2322d3ee%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23a855f7%22%2F%3E%20%3C%2FlinearGradient%3E%20%3C%2Fdefs%3E%20%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2216%22%20fill%3D%22%230b111c%22%2F%3E%20%3Cg%20fill%3D%22url%28%23g%29%22%3E%20%3Crect%20x%3D%2214%22%20y%3D%2226%22%20width%3D%226%22%20height%3D%2212%22%20rx%3D%223%22%2F%3E%20%3Crect%20x%3D%2224%22%20y%3D%2216%22%20width%3D%226%22%20height%3D%2232%22%20rx%3D%223%22%2F%3E%20%3Crect%20x%3D%2234%22%20y%3D%2221%22%20width%3D%226%22%20height%3D%2222%22%20rx%3D%223%22%2F%3E%20%3Crect%20x%3D%2244%22%20y%3D%2229%22%20width%3D%226%22%20height%3D%226%22%20rx%3D%223%22%2F%3E%20%3C%2Fg%3E%20%3C%2Fsvg%3E">
<style>
  /* 画面の前提: 横に並べず、手前に浮かせて使う細長い板。
     幅 340〜460px を基準に組み、広い画面でも中央で細いまま置く。 */
  :root {
    color-scheme: dark;
    --bg:#070a10;
    --panel:#0d121b;
    --panel-2:#121927;
    --raise:#18202f;
    --line:#1d2735;
    --line-soft:#151d29;
    --text:#e8eef7;
    --dim:#a3b0c4;      /* 8.6:1  項目名 */
    --faint:#7d8ca4;    /* 5.4:1  説明・見出し。小さい文字の下限 4.5:1 を満たす */
    --accent:#22d3ee;         /* 即時・認識中 */
    --accent-2:#a855f7;       /* 手直し */
    --ok:#34d399;             /* 送信済み */
    --warn:#fb923c;           /* 一時停止 */
    --danger:#f87171;
    --glow:0 0 14px;
    --radius:20px;
  --pill:999px;
    /* 窓の大きさで変わる寸法。色と違いテーマでは変えないので、
       ここだけを見れば「どこが縮むのか」が分かる。 */
    --pad:1rem;                            /* 左右の余白 */
    --viz-h:clamp(72px, 20vh, 124px);      /* マイクの絵の高さ */
    --viz-pad:.4rem;
    --ring:clamp(42px, 11vh, 64px);        /* 即時 / 手直しの丸 */
    --stream-max:11em;                     /* 認識中テキストの高さの上限 */
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg:#eef1f6;
    --panel:#ffffff;
    --panel-2:#f4f6fa;
    --raise:#e9edf4;
    --line:#dce2ec;
    --line-soft:#e8ecf3;
    --text:#101826;
    --dim:#4d5a6c;      /* 7.2:1 */
    --faint:#6b7889;    /* 4.6:1  小さい文字の下限を満たす */
    --accent:#0891b2;
    --accent-2:#7c3aed;
    --ok:#059669;
    --warn:#d97706;
    --danger:#dc2626;
    --glow:0 0 0;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      color-scheme: light;
      --bg:#eef1f6; --panel:#ffffff; --panel-2:#f4f6fa; --raise:#e9edf4;
      --line:#dce2ec; --line-soft:#e8ecf3;
      --text:#101826; --dim:#4d5a6c; --faint:#6b7889;
      --accent:#0891b2; --accent-2:#7c3aed; --ok:#059669; --warn:#d97706;
      --danger:#dc2626; --glow:0 0 0;
    }
  }

  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body {
    margin:0; background:var(--bg); color:var(--text);
    font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
    font-size:14px; line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  button, input, select, textarea { font:inherit; color:inherit; }
  button { cursor:pointer; background:none; border:none; padding:0; }
  button:disabled { cursor:default; }

  /* 縦は画面いっぱいに固定して、余りも不足も履歴だけが引き受ける。
     窓を縮めたときに先に削られるのが履歴になり、マイク・送り先・
     未送信の札は最後まで画面に残る。 */
  .page {
    max-width:460px; margin:0 auto; height:100vh; height:100dvh;
    background:var(--panel);
    border-left:1px solid var(--line-soft); border-right:1px solid var(--line-soft);
    display:flex; flex-direction:column;
    overflow-x:hidden; overflow-y:auto;
  }
  .page > * { flex:none; }          /* 潰れると中の文字が切れる。縮むのは下の2つだけ */
  /* 履歴がゼロになってもまだ足りないときは、未送信の札が次に譲る
     （中の認識中テキストは1行まで縮み、続きはその中で繰れる）。 */
  .page > .draft-card { flex:0 1 auto; min-height:0; }
  .log-wrap { flex:1 1 0; min-height:0; overflow-y:auto; overscroll-behavior:contain; }

  /* ── ヘッダ ───────────────────────────── */
  header {
    display:flex; align-items:center; gap:.6rem;
    padding:.85rem var(--pad) .7rem;
    border-bottom:1px solid var(--line);
  }
  .brand { display:flex; align-items:center; gap:.55rem; margin-right:auto; min-width:0; }
  .brand h1 {
    margin:0; font-size:.95rem; font-weight:600; letter-spacing:.01em;
    white-space:nowrap;
  }
  /* ロゴの波。拾えている音量でわずかに動く */
  .mark { display:flex; align-items:center; gap:2px; height:18px; flex:none; }
  .mark i {
    display:block; width:2.5px; border-radius:2px; height:30%;
    background:linear-gradient(180deg,var(--accent),var(--accent-2));
    transition:height .12s ease-out;
  }

  .icons { display:flex; align-items:center; gap:.15rem; flex:none; }
  .icon {
    position:relative; width:36px; height:36px; border-radius:50%;
    display:grid; place-items:center; color:var(--dim);
    transition:background .15s, color .15s;
  }
  .icon:hover:not(:disabled) { background:var(--raise); color:var(--text); }
  .icon:disabled { opacity:.35; }
  /* Material Symbols は塗りのパス。既定では輪郭の方だけ見せ、
     状態が「入っている」ものだけ塗りに差し替える。 */
  svg .solid { display:none; }
  .lit > svg .solid, .on .ring svg .solid { display:inline; }
  .lit > svg .line, .on .ring svg .line { display:none; }
  .icon > span { display:grid; place-items:center; }
  /* アイコンの下の点で入切を示す（モックと同じ作法） */
  .icon::after {
    content:""; position:absolute; bottom:4px; left:50%; transform:translateX(-50%);
    width:4px; height:4px; border-radius:50%; background:transparent;
  }
  .icon.lit { color:var(--text); }
  .icon.lit::after { background:var(--ok); box-shadow:var(--glow) var(--ok); }
  .icon.warn { color:var(--warn); }
  .icon.warn::after { background:var(--warn); box-shadow:var(--glow) var(--warn); }
  .icon.busy { color:var(--warn); }

  /* 状態 */
  .status {
    display:flex; align-items:center; gap:.45rem;
    padding:.5rem var(--pad) .3rem; font-size:.75rem; color:var(--dim);
    white-space:nowrap; overflow:hidden;
  }
  .beacon { width:8px; height:8px; border-radius:50%; background:var(--faint); flex:none; }
  .beacon.live { background:var(--ok); box-shadow:var(--glow) var(--ok); }
  .beacon.hold { background:var(--accent-2); box-shadow:var(--glow) var(--accent-2); }
  .beacon.off  { background:var(--warn); box-shadow:var(--glow) var(--warn); }
  .beacon.down { background:transparent; box-shadow:inset 0 0 0 1.5px var(--danger); }
  @media (prefers-reduced-motion:no-preference) {
    .beacon.live { animation:breathe 2.4s ease-in-out infinite; }
  }
  @keyframes breathe { 50% { opacity:.35; } }

  /* 送信先。聞いているセッションが2つ以上のときだけ出す
     （1つしか無いなら選ばせる意味がなく、場所を取るだけ）。 */
  /* 横に流すと、窓が狭いときに右端のものへ手が届かない。折り返して
     全部見せる。長い名前は詰めるが、頭の番号だけは必ず残す。 */
  .routes { padding:.1rem var(--pad) .5rem; }
  .route-chips { display:flex; flex-wrap:wrap; gap:.25rem; }
  .route-pick { display:none; }
  .route-chip {
    flex:0 1 auto; min-width:0; max-width:100%;
    display:inline-flex; align-items:center; gap:.3rem;
    padding:.3rem .7rem; border-radius:var(--pill);
    font-size:.75rem; white-space:nowrap;
    border:1.5px solid var(--line); color:var(--dim);
    transition:border-color .15s, color .15s, background .15s;
  }
  .route-chip .nm {
    min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .route-chip .no { font-weight:700; font-variant-numeric:tabular-nums; flex:none; }
  /* 何台かで同時に使っているときに、いまどの機械を見ているかを本体に出す。
     設定の中だけだと、間違った機械へ話しかけていても気づけない。 */
  .machine {
    font-size:.66rem; font-weight:600; padding:.1rem .5rem; border-radius:var(--pill);
    color:var(--accent-2); background:color-mix(in srgb, var(--accent-2) 16%, transparent);
    max-width:9rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .route-chip:hover { color:var(--text); }
  /* 聞くのをやめさせる×。1回目で確かめ、2回目で実行する（小窓では
     確認ダイアログが出せないのと、押し間違いで相手を切りたくないため）。 */
  .route-chip .x {
    display:grid; place-items:center; width:15px; height:15px; margin-right:-.25rem;
    border-radius:50%; font-size:.7rem; line-height:1; opacity:.45;
  }
  .route-chip .x:hover { opacity:1; background:color-mix(in srgb, var(--danger) 30%, transparent); }
  .route-chip.asking { border-color:var(--danger); color:var(--danger); background:none; }
  .route-chip.asking .x { opacity:1; }
  .route-chip.on {
    border-color:transparent; color:var(--panel); font-weight:600;
    background:linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 55%, var(--accent-2)));
  }

  /* ── ビジュアライザ ───────────────────── */
  .viz { position:relative; padding:var(--viz-pad) 0 .1rem; }
  /* 大きなマイクの当たり判定。絵は canvas 側が描くので、ここは透明。 */
  .mic-hit {
    position:absolute; left:50%; top:calc(var(--viz-pad) + var(--viz-h) / 2);
    transform:translate(-50%, -50%);
    width:calc(var(--viz-h) * .8); height:calc(var(--viz-h) * .8); border-radius:50%;
    background:transparent; cursor:pointer;
  }
  .mic-hit:disabled { cursor:default; }
  /* マイク表示でないときは押せる場所を作らない（波形は操作対象ではない） */
  #viz { display:block; width:100%; height:var(--viz-h); }
  /* マイクの入切と音量メーターを1行に並べる */
  .meter-row { display:flex; align-items:center; gap:.55rem; padding:0 var(--pad); }
  .meter-row .meter-hit { flex:1; min-width:0; padding-left:0; padding-right:0; }

  /* デーモンが拾えている音量。ブラウザ側の波形とは別の経路なので、
     ここが動かないのに波形が動いていれば認識側が死んでいると分かる。 */
  /* 掴みやすいよう、線そのものより広い範囲で受ける */
  .meter-hit { padding:12px 0; cursor:ew-resize; touch-action:none; }
  .meter {
    position:relative; height:3px;
    border-radius:var(--pill); background:var(--line);
  }
  .meter-hit:hover .meter-mark, .meter-hit.dragging .meter-mark {
    height:14px; top:-5.5px; width:3px;
  }
  /* しきい値の位置。ここを超えた分が発話として拾われる。 */
  .meter-mark {
    position:absolute; top:-3px; width:2px; height:9px; border-radius:var(--pill);
    background:var(--warn); box-shadow:var(--glow) var(--warn);
    transform:translateX(-50%);
    transition:height .12s, width .12s, top .12s;
  }
  .meter-fill {
    height:100%; width:0; border-radius:2px; background:var(--faint);
    transition:width .1s linear, background .2s;
  }
  .meter-fill.on { background:var(--accent); box-shadow:var(--glow) var(--accent); }

  /* ── 送り先（即時 / 手直し） ───────────── */
  .modes {
    display:flex; align-items:center; justify-content:center; gap:0;
    padding:1rem var(--pad) .9rem;
  }
  .mode {
    flex:1; display:flex; flex-direction:column; align-items:center; gap:.5rem;
    color:var(--faint); transition:color .18s;
  }
  .mode .ring {
    width:var(--ring); height:var(--ring); border-radius:50%;
    display:grid; place-items:center;
    border:2px solid var(--line);
    background:var(--panel-2);
    transition:border-color .18s, box-shadow .18s, background .18s, transform .12s;
  }

  .mode span { font-size:.8rem; font-weight:600; }
  /* 中の絵も丸に合わせる。iconSvg が寸法を inline style で付けるので、
     こちらから決め直すには !important が要る。 */
  .mode .ring svg {
    width:calc(var(--ring) * .44) !important; height:calc(var(--ring) * .44) !important;
  }
  .mode:hover:not(:disabled) .ring { transform:translateY(-1px); }
  .mode:disabled { opacity:.4; }

  /* 一時停止のボタンは、押したら何が起きるかを絵で示す。
     聞いている間は「止める」、止めている間は「再開する」。 */

  #segLive.on { color:var(--accent); }
  #segLive.on .ring {
    border-color:transparent; color:var(--panel);
    background:linear-gradient(145deg, var(--accent), color-mix(in srgb, var(--accent) 55%, var(--accent-2)));
    box-shadow:0 0 22px color-mix(in srgb, var(--accent) 55%, transparent);
  }
  #segHold.on { color:var(--accent-2); }
  #segHold.on .ring {
    border-color:transparent; color:var(--panel);
    background:linear-gradient(145deg, color-mix(in srgb, var(--accent-2) 70%, var(--accent)), var(--accent-2));
    box-shadow:0 0 22px color-mix(in srgb, var(--accent-2) 55%, transparent);
  }
  /* ミュート中は選べないので沈めるが、どちらに戻るのかは分かるようにする。
     色だけ抜いて灰色にし、選ばれている方をひとつぶん起こす。 */
  .modes.muted .mode { opacity:.26; }
  .modes.muted .mode.on { opacity:.55; }
  .modes.muted #segLive.on, .modes.muted #segHold.on { color:var(--faint); }
  .modes.muted #segLive.on .ring, .modes.muted #segHold.on .ring {
    background:var(--raise); color:var(--faint);
    border-color:var(--line); box-shadow:none;
  }

  .hint {
    margin:0; padding:0 var(--pad) .6rem; min-height:1.4em;
    font-size:.72rem; color:var(--faint);
  }
  /* Claude 側で送り先を切り替えたときの一言。
     自分で押していない変更は、理由が無いと戸惑うだけになる。 */
  .note {
    margin:0 var(--pad) .6rem; padding:.5rem .75rem;
    border-radius:12px; font-size:.76rem; line-height:1.5;
    color:var(--accent-2);
    background:color-mix(in srgb, var(--accent-2) 12%, transparent);
    border:1px solid color-mix(in srgb, var(--accent-2) 30%, transparent);
  }
  .hint button {
    margin-left:.4rem; color:var(--accent); text-decoration:underline;
    font-size:.72rem;
  }

  /* ── 履歴 ─────────────────────────────── */
  .log-head {
    display:flex; align-items:center; gap:.5rem;
    padding:.7rem var(--pad) .55rem; border-top:1px solid var(--line);
  }
  .log-head h2 {
    margin:0; margin-right:auto; font-size:.8rem; font-weight:600;
    display:flex; align-items:center; gap:.35rem;
  }
  .log-head h2 svg { opacity:.75; }
  .filters { display:flex; gap:.15rem; background:var(--panel-2); padding:3px; border-radius:var(--pill); }
  .filters button {
    font-size:.7rem; padding:.25rem .7rem; border-radius:var(--pill); color:var(--faint);
    transition:background .15s, color .15s;
  }
  .filters button.on { background:var(--raise); color:var(--text); }

  #log { padding:0 calc(var(--pad) - .25rem) .5rem; display:flex; flex-direction:column; gap:.4rem; }

  .entry {
    background:var(--panel-2); border:1px solid var(--line-soft);
    border-radius:var(--radius); padding:.6rem .75rem;
  }
  .entry .gutter {
    display:flex; align-items:center; gap:.4rem;
    font-size:.66rem; color:var(--faint); margin-bottom:.2rem;
    font-variant-numeric:tabular-nums;
  }
  .entry .mark {
    display:inline-flex; align-items:center; gap:.25rem;
    padding:.05rem .4rem; border-radius:5px; font-size:.64rem; font-weight:600;
  }
  .entry .mark::before { content:"✓"; font-size:.7em; }
  .entry .mark.sent   { color:var(--ok);       background:color-mix(in srgb, var(--ok) 14%, transparent); }
  .entry .mark.edited { color:var(--accent-2); background:color-mix(in srgb, var(--accent-2) 14%, transparent); }
  /* どのセッションへ送ったか。複数の作業で使っているとき、履歴を見て
     「これはどっちに言ったんだっけ」が分からなくなるのを防ぐ。 */
  .entry .to {
    display:inline-flex; align-items:center; gap:.2rem; min-width:0;
    padding:.05rem .4rem; border-radius:5px; font-size:.64rem;
    color:var(--dim); background:var(--raise);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:12rem;
  }
  .entry .to svg { opacity:.75; }
  .entry .text { font-size:.88rem; line-height:1.65; word-break:break-word; }

  /* 未送信カード。認識中のテキストもここに出る（一等地に置く） */
  /* 縦に並べておくと、席が足りないときに認識中のテキストだけを詰められる。
     残りは動かないので、ボタンの位置が勝手に変わらない。 */
  .draft-card {
    display:flex; flex-direction:column;
    margin:0 calc(var(--pad) - .25rem) .4rem;
    background:var(--panel-2);
    border:1.5px solid color-mix(in srgb, var(--accent) 55%, var(--line));
    border-radius:var(--radius); padding:.6rem .75rem;
    box-shadow:0 0 0 1px color-mix(in srgb, var(--accent) 10%, transparent);
  }
  .draft-card .gutter {
    display:flex; align-items:center; gap:.4rem;
    font-size:.66rem; color:var(--faint); margin-bottom:.25rem;
    font-variant-numeric:tabular-nums;
  }
  .draft-card .gutter .spacer { flex:1; }
  .draft-card .gutter, .draft-card .draft-actions { flex:none; }
  .draft-card > textarea { flex:0 1 auto; }   /* 席が足りなければここも詰まる */
  /* 「直す」「消す」。小さな道具なので、ひとつずつ輪郭を描くと騒がしい。
     本体のモード切り替えと同じ「ひとつの台の上に並ぶ」形にして、台がある
     ことでボタンだと分かるようにする。色は触れたときにだけ出す。 */
  .tiny-row {
    display:flex; align-items:center; gap:.25rem;
    background:var(--panel-2); border:1px solid var(--line);
    border-radius:var(--pill); padding:3px;
  }
  .tiny {
    display:grid; place-items:center; width:30px; height:30px;
    border-radius:50%; color:var(--faint);
    transition:color .14s, background .14s, transform .1s;
  }
  .tiny:hover:not(:disabled) { background:var(--raise); }
  .tiny:active:not(:disabled) { transform:scale(.9); }
  .tiny.edit:hover:not(:disabled) { color:var(--accent-2); }
  .tiny.warn:hover:not(:disabled) { color:var(--danger); }
  /* 触れたら塗りに変わる。押す前に「これだ」と分かる手応えになる。 */
  .tiny:hover:not(:disabled) > svg .solid { display:inline; }
  .tiny:hover:not(:disabled) > svg .line { display:none; }
  .tiny:disabled { opacity:.28; cursor:default; }
  /* 札のどこを押しても直しに回せると分かるようにする */
  .draft-card:not(.holding):not(.editing) { cursor:text; }
  .draft-card:not(.holding):not(.editing):hover {
    border-color:color-mix(in srgb, var(--accent-2) 45%, var(--line));
  }
  .draft-card .draft-actions, .draft-card .tiny-row { cursor:default; }
  .draft-card .mark {
    padding:.05rem .4rem; border-radius:5px; font-size:.64rem; font-weight:600;
    color:var(--accent); background:color-mix(in srgb, var(--accent) 14%, transparent);
  }
  /* 認識中の生テキスト。編集欄とは別に置き、確定した分だけ下へ落とす。
     ここを編集欄に直接流し込むと、手直し中の文字を上書きしてしまう。 */
  /* 一息で長く喋ると、認識中のテキストだけで画面が埋まる。上限を決めて、
     はみ出した分はここだけを繰る（末尾を見せる処理は JS 側）。 */
  .stream {
    flex:1 1 auto; font-size:.88rem; line-height:1.65; color:var(--text);
    min-height:1.5em; max-height:var(--stream-max);
    overflow-y:auto; overscroll-behavior:contain;
    /* 繰れることは伝えたいが、細い窓では棒が本文を押しのける */
    scrollbar-width:thin; scrollbar-color:var(--line) transparent;
  }
  /* 合図として受け取った言葉。指示ではなく操作として扱ったことを、
     その言葉自体を光らせて示す。 */
  .stream mark.cmd {
    display:inline-block; padding:.05rem .45rem; border-radius:7px;
    font-weight:600; background:transparent;
    animation:cmdFade 2.2s ease-out forwards;
  }
  .stream mark.cmd.live { color:var(--accent);   background:color-mix(in srgb, var(--accent) 18%, transparent); }
  .stream mark.cmd.hold { color:var(--accent-2); background:color-mix(in srgb, var(--accent-2) 18%, transparent); }
  .stream mark.cmd.warn { color:var(--danger);   background:color-mix(in srgb, var(--danger) 18%, transparent); }
  @keyframes cmdFade { 0%,65% { opacity:1; } 100% { opacity:0; } }
  #stream:empty::after { content:attr(data-quiet); color:var(--faint); font-size:.8rem; }
  .caret {
    display:inline-block; width:1.5px; height:1em; background:var(--accent);
    margin-left:2px; vertical-align:-.12em; box-shadow:var(--glow) var(--accent);
  }
  @media (prefers-reduced-motion:no-preference) {
    .caret { animation:blink 1.1s step-end infinite; }
  }
  @keyframes blink { 50% { opacity:0; } }
  .draft-card.idle .caret { display:none; }
  /* 「今回だけ直す」を押した状態。送り先は即時のままなので、
     ここの色だけで「この一言は止めてある」と示す。 */
  .draft-card.editing {
    border-color:var(--accent-2);
    box-shadow:0 0 0 1px color-mix(in srgb, var(--accent-2) 22%, transparent);
  }
  .draft-card.editing .mark {
    color:var(--accent-2); background:color-mix(in srgb, var(--accent-2) 16%, transparent);
  }

  #draft {
    display:block; width:100%; margin-top:.5rem; padding:.6rem .75rem;
    background:var(--panel); border:1px solid var(--line); border-radius:16px;
    font-size:.88rem; line-height:1.65; resize:none; overflow-y:auto;
    min-height:3.4em; max-height:var(--stream-max);
  }
  #draft:focus { outline:none; border-color:var(--accent-2); }
  .draft-actions { display:flex; align-items:center; gap:.4rem; margin-top:.5rem; }
  .draft-actions .spacer { flex:1; }
  .round {
    width:38px; height:38px; border-radius:50%; display:grid; place-items:center;
    border:2px solid var(--line); color:var(--dim);
    transition:border-color .15s, color .15s, box-shadow .15s;
  }
  .round svg { width:17px; height:17px; stroke-width:2.1; }
  .round:hover { color:var(--text); border-color:var(--dim); }
  .round.go { border-color:var(--accent); color:var(--accent); }
  .round.go:hover { box-shadow:var(--glow) color-mix(in srgb, var(--accent) 50%, transparent); }

  .none { padding:1.5rem var(--pad); text-align:center; font-size:.78rem; color:var(--faint); }

  /* 画面そのものが更新されたときだけ出る。常設のボタンは置かない。
     浮かせた小窓には再読み込みの手立てが無いので、ここから促す。 */
  .fresh {
    position:fixed; left:50%; bottom:1rem; transform:translateX(-50%);
    display:flex; align-items:center; gap:.4rem; z-index:30;
    padding:.45rem .9rem; border-radius:var(--pill);
    background:var(--accent); color:var(--panel);
    font-size:.78rem; font-weight:600;
    box-shadow:0 4px 18px color-mix(in srgb, var(--accent) 45%, transparent);
  }

  /* 引き下がった窓。中身は隠して、戻る道だけ残す。 */
  .taken {
    position:fixed; inset:0; z-index:50;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:1rem; padding:2rem; text-align:center;
    background:var(--bg); color:var(--faint); font-size:.85rem; line-height:1.7;
  }
  .taken p { margin:0; max-width:22rem; }

  /* 最前面にするには人が押す必要があるので、一度だけ誘う */
  .fresh.ask {
    background:var(--accent-2); color:var(--panel);
    box-shadow:0 4px 18px color-mix(in srgb, var(--accent-2) 45%, transparent);
  }

  /* ── 設定パネル ───────────────────────── */
  .sheet {
    position:fixed; inset:0; z-index:20; overflow-y:auto;
    background:var(--panel);
  }
  .sheet-inner { max-width:460px; margin:0 auto; padding-bottom:2rem; }
  .sheet-head {
    position:sticky; top:0; z-index:1;
    display:flex; align-items:center; gap:.4rem;
    padding:.7rem var(--pad) .7rem .5rem; background:var(--panel);
    border-bottom:1px solid var(--line);
  }
  .sheet-head .icon::after { display:none; }   /* 状態を示す点は要らない */
  .sheet-head h2 { margin:0; font-size:1rem; font-weight:600; margin-right:auto; }

  .group { padding:1.1rem var(--pad); border-bottom:1px solid var(--line-soft); }
  .group > h3 {
    display:flex; align-items:center; gap:.4rem;
    margin:0 0 .8rem; font-size:.75rem; font-weight:700; letter-spacing:.06em;
    text-transform:uppercase; color:var(--faint);
  }
  /* 項目名にも小さな絵を添える。文字だけの一覧にしない。 */
  .field > label {
    display:flex; align-items:center; gap:.35rem;
  }
  .field { display:flex; align-items:center; gap:.6rem; margin-bottom:.6rem; }
  .field:last-child { margin-bottom:0; }
  .field > label { font-size:.875rem; color:var(--text); flex:none; min-width:7rem; }
  .field .val {
    margin-left:auto; font-size:.8rem; color:var(--text); text-align:right;
    font-variant-numeric:tabular-nums; flex:none; min-width:3.2rem;
  }
  select, input[type=text], input[type=file] {
    flex:1; min-width:0; padding:.45rem .85rem;
    background:var(--panel-2); border:1px solid var(--line); border-radius:var(--pill);
    font-size:.85rem;
  }
  select:focus, input:focus, textarea:focus { outline:none; border-color:var(--accent); }

  input[type=range] {
    flex:1; min-width:0; -webkit-appearance:none; appearance:none;
    height:4px; border-radius:3px; background:var(--line);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance:none; width:17px; height:17px; border-radius:50%;
    background:var(--accent); box-shadow:var(--glow) color-mix(in srgb, var(--accent) 50%, transparent);
    cursor:pointer;
  }
  .range-note { font-size:.75rem; line-height:1.5; color:var(--faint); margin:-.1rem 0 .8rem; }
  /* 手元で完結しなくなる設定には、その場ではっきり書く */
  .warn-note {
    margin:.6rem 0 0; padding:.55rem .75rem; border-radius:12px;
    font-size:.75rem; line-height:1.55; color:var(--warn);
    background:color-mix(in srgb, var(--warn) 12%, transparent);
    border:1px solid color-mix(in srgb, var(--warn) 32%, transparent);
  }

  /* 感度を決めるための実測メーター。しきい値の位置に印を出す。 */
  .gauge {
    position:relative; height:6px; border-radius:var(--pill);
    background:var(--line); overflow:visible;
    margin:.1rem 0 .5rem calc(6.5rem + .6rem);
  }
  .gauge-fill {
    height:100%; width:0; border-radius:var(--pill); background:var(--dim);
    transition:width .1s linear, background .2s;
  }
  .gauge-fill.on { background:var(--accent); }
  .gauge-mark {
    position:absolute; top:-3px; width:2px; height:12px; border-radius:1px;
    background:var(--warn); box-shadow:var(--glow) var(--warn);
  }

  .seg-row { display:flex; flex:1; gap:.2rem; background:var(--panel-2); padding:3px; border-radius:var(--pill); }
  .seg-row button {
    flex:1; white-space:nowrap; font-size:.8rem; padding:.4rem .5rem;
    border-radius:var(--pill); color:var(--faint);
    transition:background .15s, color .15s;
  }
  .seg-row button.on { background:var(--raise); color:var(--text); }

  .toggle { display:flex; align-items:center; gap:.55rem; font-size:.875rem; color:var(--text); }
  .toggle input { accent-color:var(--accent); width:15px; height:15px; }

  /* 3段に分ける。塗り＝その画面で確定させたい操作、淡い塗り＝補助、
     輪郭＝それ以外。ひとつの区画に塗りは1つだけにする。 */
  .btn {
    display:inline-flex; align-items:center; gap:.4rem;
    padding:.45rem 1rem; border-radius:var(--pill); font-size:.82rem; font-weight:500;
    border:1.5px solid var(--line); background:transparent; color:var(--dim);
    transition:border-color .15s, color .15s, background .15s;
  }
  .btn:hover:not(:disabled) { color:var(--text); border-color:var(--dim); }
  /* 塗り */
  .btn.go {
    border-color:transparent; color:var(--panel); font-weight:600;
    background:linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 55%, var(--accent-2)));
    box-shadow:0 2px 10px color-mix(in srgb, var(--accent) 35%, transparent);
  }
  .btn.go:hover:not(:disabled) {
    color:var(--panel);
    box-shadow:0 2px 16px color-mix(in srgb, var(--accent) 55%, transparent);
  }
  /* 淡い塗り */
  .btn.tonal {
    border-color:transparent; color:var(--accent);
    background:color-mix(in srgb, var(--accent) 15%, transparent);
  }
  .btn.tonal:hover:not(:disabled) {
    color:var(--accent);
    background:color-mix(in srgb, var(--accent) 24%, transparent);
  }
  .btn.busy { opacity:.6; }
  .btn:disabled { opacity:.45; }
  .btn-row { display:flex; align-items:center; gap:.4rem; flex-wrap:wrap; }
  .btn-row .spacer { flex:1; }

  /* 辞書 */
  .dict-tabs { display:flex; gap:.2rem; background:var(--panel-2); padding:3px; border-radius:var(--pill); margin-bottom:.6rem; }
  .dict-tabs button {
    display:inline-flex; align-items:center; justify-content:center; gap:.35rem;
    flex:1; white-space:nowrap; font-size:.8rem; padding:.4rem;
    border-radius:var(--pill); color:var(--faint);
  }
  .dict-tabs button.on { background:var(--raise); color:var(--text); }
  .dict-label { margin:0 0 .6rem; font-size:.78rem; color:var(--faint); }
  .new-row { display:flex; align-items:center; gap:.3rem; margin-bottom:.5rem; }
  .new-row input { flex:1; min-width:0; padding:.45rem .85rem;
    background:var(--panel-2); border:1px solid var(--line); border-radius:var(--pill); font-size:.83rem; }
  .arrow { color:var(--faint); font-size:.8rem; flex:none; }
  .filter { width:100%; margin-bottom:.5rem; padding:.45rem .85rem;
    background:var(--panel-2); border:1px solid var(--line); border-radius:var(--pill); font-size:.83rem; }
  .rows { display:flex; flex-direction:column; gap:.25rem; max-height:15rem; overflow-y:auto; }
  .row { display:flex; align-items:center; gap:.3rem; }
  .row.hit input { border-color:var(--accent); }
  .row input { flex:1; min-width:0; padding:.4rem .8rem;
    background:var(--panel-2); border:1px solid var(--line); border-radius:var(--pill); font-size:.83rem; }
  .row .del { display:grid; place-items:center; width:28px; height:28px;
    color:var(--faint); border-radius:50%; flex:none; }
  .row .del:hover { color:var(--danger); background:var(--raise); }
  .chips { display:flex; flex-wrap:wrap; gap:.25rem; }
  .chip { font-size:.75rem; padding:.15rem .6rem; border-radius:var(--pill);
    background:var(--panel-2); color:var(--faint); border:1px solid var(--line-soft); }
  .builtin-head { margin-top:.7rem; }
  /* chrome:// は web ページから開けない決まりなので、押したら写す。
     行き先が分かる形にしておかないと、どこを触ればよいのか伝わらない。 */
  .link {
    color:var(--accent); text-decoration:underline; text-underline-offset:2px;
    font-size:inherit; word-break:break-all; text-align:left;
  }
  .link:hover { color:var(--text); }
  .dict-note, .scope-note { font-size:.75rem; line-height:1.5; color:var(--faint); margin:.5rem 0 0; }


  /* ── 窓を小さくしたとき ─────────────────
     残す順に優先度がある。マイクの入切 ＞ 即時 / 手直し ＞ 送信先 ＞
     認識中のテキスト。

     文字と押す場所の大きさは変えない。読めない・狙えないボタンでは
     小さくした意味が無い。削るのは上の帯・余白・説明の行、そして
     マイクと送り方を横に並べ替えて縦を空けること。
     履歴は .log-wrap が flex で伸び縮みするので、ここでは触らない。 */

  /* 幅が狭い。左右の余白から詰める */
  @media (max-width: 379px) {
    :root { --pad:.7rem; }
    .machine { max-width:7rem; }
  }
  @media (max-width: 279px) {
    :root { --pad:.55rem; }
    .brand h1, #logoMark { display:none; }   /* 名札だけ残す */
    .machine { max-width:100%; }
    /* 設定も同じ幅に畳む。項目名を上の段へ逃がして、つまみに幅を渡す */
    .field { flex-wrap:wrap; gap:.35rem .6rem; }
    .field > label { flex:1 0 100%; min-width:0; }
    .field .val { margin-left:0; }
    .gauge { margin-left:0; }
  }

  /* 背が低い。履歴の見出しと説明の行を畳んで、縦の余白を詰める */
  @media (max-height: 639px) {
    :root { --viz-pad:.25rem; --stream-max:6em; }
    .hint { display:none; }
    .log-head { display:none; }
    .log-wrap { border-top:1px solid var(--line); }   /* 見出しの区切りを引き継ぐ */
    .status { padding-top:.3rem; padding-bottom:.1rem; }
  }

  /* さらに低い。感度の線は設定からも変えられるので、ここで譲る */
  @media (max-height: 479px) {
    :root { --stream-max:4.5em; }
    .meter-row { display:none; }
    /* 手直しの欄を開いている間は、認識中の行を1行に抑える。
       直している文と送るボタンの方が先に見えていてほしい。 */
    .draft-card:has(> textarea:not([hidden])) .stream { max-height:1.7em; }
    #draft { min-height:2.4em; }
  }

  /* ほとんど余地が無い。状態の一行は残す — ここを消すと、
     届いていないことに気づく手がかりが画面から無くなる */
  @media (max-height: 429px) {
    /* 未送信の札は、札と道具の行だけで 50px 近く使う。ボタンは小さくせず、
       まわりの余白の方を削って、喋った中身が見える高さを空ける。 */
    .draft-card { padding:.28rem .55rem .38rem; }
    .draft-card .gutter { margin-bottom:.05rem; }
    .tiny-row { padding:2px; }
    /* 手直しの欄を開いている間は、認識中の行は引っ込める。直している文と
       送るボタンが先に見えていてほしい。聞こえているかはマイクの絵で分かる。 */
    .draft-card:has(> textarea:not([hidden])) .stream { display:none; }
    .draft-card:has(> textarea:not([hidden])) .draft-actions { margin-top:.3rem; }
  }

  @media (max-height: 379px) {
    :root { --stream-max:3em; }
    #draft { min-height:2em; }
    .mode span:not(.ring) { display:none; }   /* 丸の絵で区別がつく */
    .mode { gap:0; }
    .routes { padding-bottom:.35rem; }
    /* 送信先の札は1つずつ行を使う。ここまで低いとそれだけで埋まるので、
       名前は省かずに、ひとまとめの選び方へ替える。 */
    .route-chips { display:none; }
    /* 選ばれている札と同じ見た目にする。ここだけ地の色に戻ると、
       いまどこへ届くのかが札のときより弱く見えてしまう。 */
    .route-pick {
      display:block; width:100%; padding:.32rem .7rem; font-size:.8rem;
      font-weight:600; border-color:transparent; color:var(--panel);
      background:linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 55%, var(--accent-2)));
    }
    /* 開いた一覧は地の色に戻す（塗りのままだと文字が読めない） */
    .route-pick option { background:var(--panel-2); color:var(--text); font-weight:400; }
    .draft-card { margin-bottom:.25rem; }
  }

  /* ここまで来たら、上の帯ごと畳む。名札も設定もタブに戻す道も、いまは
     場所の方が要る。状態はウィンドウの題と、マイクが動くかどうかで分かる。
     広げれば戻ってくる。 */
  @media (max-height: 319px) {
    header, .status { display:none; }
    .control-row { padding-top:.25rem; }
    /* 「未送信」の札と時刻は畳み、道具は本文の横へ回す。行をひとつ
       まるごと空けられるので、余白を詰めるより効く。手直しの欄と
       送るボタンは、開いたときだけ下の行へ折り返す。 */
    .draft-card { flex-flow:row wrap; align-items:flex-start; gap:.4rem; }
    .draft-card .mark, .draft-card .gutter .spacer, #draftTime { display:none; }
    .draft-card .gutter { order:2; flex:none; margin:0; }
    /* 手直し中は本文の行が消えるので、道具だけが左に取り残される */
    .draft-card:has(> textarea:not([hidden])) .gutter { margin-left:auto; }
    .draft-card .stream { order:1; flex:1 1 6em; min-width:0; }
    .draft-card > textarea { order:3; flex:1 1 100%; margin-top:0; }
    .draft-card .draft-actions { order:4; flex:1 1 100%; margin-top:0; }
  }

  /* 横に並べ替える。マイクを左に大きく置き、丸2つを右へ。
     縦に積むと、この2つだけで 200px 以上を使ってしまう。
     ここは他の段より後に置く（余白の決め方をこちらで上書きするため）。 */
  @media (max-height: 559px) {
    :root {
      --viz-pad:.25rem;
      --viz-h:clamp(78px, 26vh, 112px);
      --ring:clamp(46px, 15vh, 60px);
    }
    .control-row {
      display:flex; align-items:center; gap:.5rem;
      padding:0 var(--pad) .1rem;
    }
    .viz { flex:none; width:calc(var(--viz-h) * .95); padding:var(--viz-pad) 0; }
    .modes { flex:1; min-width:0; padding:.15rem 0; }
    /* 上の帯は名札だけでよい。題も波も、いま見る必要がない */
    header { padding:.35rem var(--pad) .25rem; gap:.35rem; }
    .brand h1, #logoMark { display:none; }
    .machine { max-width:100%; }
    .status { padding:.15rem var(--pad) .1rem; }
  }

  [hidden] { display:none !important; }
</style>
</head>
<body>
<div class="page" id="page">

  <header>
    <div class="brand">
      <div class="mark" id="logoMark" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <h1>VoiceShell</h1>
      <span class="machine" id="machineTag" hidden></span>
    </div>
    <div class="icons">
      <button class="icon" id="floatBtn" data-icon="picture_in_picture" data-icon-size="20"
              data-i18n-title="floatBtn" hidden></button>
      <button class="icon" id="openSettings" data-icon="settings" data-icon-size="20"
              data-i18n-title="settingsTitle"></button>
    </div>
  </header>

  <div class="status">
    <span class="beacon" id="beacon"></span><span id="stateText" data-i18n="connecting">Connecting…</span>
  </div>

  <!-- マイクと送り方。窓が小さいときは縦に積まず、マイクを左に置いて
       丸2つを右へ並べる（縦を使い切らないため）。 -->
  <div class="control-row">
    <div class="viz">
      <canvas id="viz"></canvas>
      <!-- 大きなマイクを押すと入切する。絵は canvas なので、
           押せる範囲だけ透明な丸を重ねる。 -->
      <button class="mic-hit" id="segOff" aria-pressed="false"></button>
    </div>

    <div class="modes" id="modes">
      <button class="mode on" id="segLive" role="radio" aria-checked="true">
        <span class="ring" data-icon="bolt" data-icon-size="28"></span>
        <span data-i18n="modeLive">Instant</span>
      </button>
      <button class="mode" id="segHold" role="radio" aria-checked="false">
        <span class="ring" data-icon="edit" data-icon-size="28"></span>
        <span data-i18n="modeHold">Review</span>
      </button>
    </div>
  </div>

  <!-- デーモンが拾えている音量。ブラウザの波形とは別経路なので、
       波形が動くのにここが動かなければ認識側が落ちていると分かる。
       印をつまむと感度が変わる。細い線のままでは掴めないので、
       見た目より広い当たり判定を親に持たせている。 -->
  <div class="meter-row">
    <div class="meter-hit" id="meterHit" data-i18n-title="thresholdMark">
      <div class="meter" id="meter">
        <div class="meter-fill" id="meterFill"></div>
        <div class="meter-mark" id="meterMark"></div>
      </div>
    </div>
  </div>

  <p class="note" id="note" hidden></p>
  <p class="hint" id="hint"></p>

  <!-- 送信先。複数の作業で同時に使うときに、どれへ届けるかを選ぶ。
       未送信の札のすぐ上に置く（次に喋る一言がどこへ行くかの話なので、
       送る手前で目に入る位置がよい）。 -->
  <div class="routes" id="routes" hidden>
    <div class="route-chips" id="routeChips"></div>
    <!-- 高さが尽きたら、札を並べる代わりにこちらを出す（CSS が切り替える）。
         札は1つずつ行を使うので、相手が増えると縦を食い切ってしまう。 -->
    <select class="route-pick" id="routePick" data-i18n-title="routePick"></select>
  </div>

  <!-- 未送信カード。認識中のテキストと手直し欄をここにまとめる。 -->
  <section class="draft-card idle" id="tray" aria-live="polite">
    <div class="gutter">
      <span class="mark" id="draftMark" data-i18n="unsent">Unsent</span>
      <span id="draftTime"></span>
      <span class="spacer"></span>
      <span class="tiny-row">
        <button class="tiny edit" id="editOnce" data-icon="edit" data-icon-size="16"
                data-i18n-title="editOnce"></button>
        <button class="tiny warn" id="dropOne" data-icon="delete" data-icon-size="16"
                data-i18n-title="dropOne"></button>
      </span>
    </div>
    <div class="stream"><span id="stream" data-i18n-quiet="quiet"></span><span class="caret"></span></div>
    <textarea id="draft" data-i18n-ph="draftPlaceholder" hidden></textarea>
    <div class="draft-actions" id="draftActions" hidden>
      <span class="spacer"></span>
      <button class="round" id="discard" data-icon="delete" data-icon-size="20"
              data-i18n-title="discardTitle"></button>
      <button class="round go" id="send" data-icon="send" data-icon-size="20"
              data-i18n-title="sendTitle"></button>
    </div>
  </section>

  <div class="log-head">
    <h2 data-icon="list_alt" data-icon-size="15" data-i18n="history">History</h2>
  </div>

  <div class="log-wrap">
    <div id="log"></div>
    <p class="none" id="none" data-i18n="empty">Nothing sent yet. Speak and it shows up here.</p>
  </div>

  <button class="fresh" id="fresh" data-icon="auto_awesome" data-icon-size="15"
          data-i18n="uiUpdated" hidden>Updated — tap to reload</button>

  <!-- 同じ画面を2つ開いても見るものは同じで、マイクだけ二重に掴む。
       後から開いた方を本物にして、こちらは引き下がる。 -->
  <div class="taken" id="taken" hidden>
    <p data-i18n="takenOver">This viewer is open in another window.</p>
    <button class="btn go" id="takeBack" data-icon="picture_in_picture"
            data-icon-size="17" data-i18n="takeBack">Use this one</button>
  </div>

  <!-- 独立した窓では開けるが、最前面に固定するのは人が押さないと始められない
       （ブラウザの決まり）。一度使ったらもう出さない。 -->
  <button class="fresh ask" id="floatAsk" data-icon="picture_in_picture" data-icon-size="15"
          data-i18n="floatAsk" hidden>Keep on top</button>

</div><!-- /page -->

<!-- ── 設定 ─────────────────────────────── -->
<section class="sheet" id="sheet" hidden>
 <div class="sheet-inner">
  <div class="sheet-head">
    <button class="icon" id="closeSettings" data-icon="arrow_back_ios_new"
            data-icon-size="18" data-i18n-title="back"></button>
    <h2 data-i18n="settings">Settings</h2>
  </div>

  <!-- 入力 -->
  <div class="group">
    <h3 data-icon="mic" data-icon-size="16" data-i18n="grpInput">Input</h3>
    <div class="field">
      <label for="mic" data-icon="mic" data-icon-size="17" data-i18n="micDevice">Microphone</label>
      <select id="mic"></select>
    </div>
    <div class="field" id="recogLangField" hidden>
      <label for="recogLang" data-icon="translate" data-icon-size="17" data-i18n="recogLang">Recognition language</label>
      <select id="recogLang"></select>
    </div>
    <div class="field">
      <label for="thresh" data-icon="graphic_eq" data-icon-size="17" data-i18n="sensitivity">Sensitivity</label>
      <input type="range" id="thresh" min="0" max="1000" step="1">
      <span class="val" id="threshVal"></span>
    </div>
    <!-- 実際に拾えている音量としきい値を並べて出す。
         数字だけでは「いくつが自分に合うか」を決めようがない。 -->
    <div class="gauge" id="gauge">
      <div class="gauge-fill" id="gaugeFill"></div>
      <div class="gauge-mark" id="gaugeMark"></div>
    </div>
    <p class="range-note" data-i18n="sensitivityNote"></p>
    <div class="btn-row" style="margin-top:.5rem">
      <button class="btn" id="calibBtn" data-icon="auto_awesome" data-icon-size="17"
              data-i18n="calibrate">Auto-tune</button>
    </div>
    <p class="range-note" id="calibNote" style="margin-top:.5rem"></p>
    <div class="field">
      <label for="silence" data-icon="timer" data-icon-size="17" data-i18n="silence">Pause to send</label>
      <input type="range" id="silence" min="0.5" max="3" step="0.1">
      <span class="val" id="silenceVal"></span>
    </div>
    <p class="range-note" data-i18n="silenceNote"></p>
    <div class="field">
      <label for="minChars" data-icon="short_text" data-icon-size="17" data-i18n="minChars">Min length</label>
      <input type="range" id="minChars" min="1" max="40" step="1">
      <span class="val" id="minCharsVal"></span>
    </div>
    <p class="range-note" data-i18n="minCharsNote"></p>
    <label class="toggle"><input type="checkbox" id="clean"><span data-i18n="stripFillers">Strip filler words</span></label>
  </div>

  <!-- 認識のやり方 -->
  <div class="group" id="engineGroup">
    <h3 data-icon="translate" data-icon-size="14" data-i18n="grpEngine">Recognition</h3>
    <div class="field">
      <label for="enginePick" data-icon="graphic_eq" data-icon-size="17" data-i18n="engineLabel">Recognized by</label>
      <select id="enginePick"></select>
    </div>
    <p class="range-note" id="engineNote"></p>
    <div class="field" id="asrLangField" hidden>
      <label for="asrLang" data-icon="language" data-icon-size="17" data-i18n="asrLang">Spoken language</label>
      <select id="asrLang"></select>
    </div>
    <p class="range-note" id="browserMic" hidden>
      <span data-i18n="browserMicNote"></span>
      <button class="link" id="micSettingsLink">chrome://settings/content/microphone</button>
    </p>
    <p class="warn-note" id="browserAsrWarn" data-i18n="browserAsrWarn" hidden></p>
    <div id="powerRow">
      <div class="btn-row" style="margin-top:.7rem">
        <button class="btn" id="power" data-icon="power_settings_new"
                data-icon-size="17"><span id="powerLabel"></span></button>
      </div>
      <p class="range-note" data-i18n="powerNote"></p>
    </div>
  </div>

  <!-- 見た目 -->
  <div class="group">
    <h3 data-icon="palette" data-icon-size="16" data-i18n="grpLook">Appearance</h3>
    <div class="field">
      <label data-icon="contrast" data-icon-size="17" data-i18n="theme">Theme</label>
      <div class="seg-row" id="themeRow">
        <button data-theme-choice="auto" data-i18n="themeAuto">Auto</button>
        <button data-theme-choice="light" data-i18n="themeLight">Light</button>
        <button data-theme-choice="dark" data-i18n="themeDark">Dark</button>
      </div>
    </div>
    <div class="field">
      <label data-icon="language" data-icon-size="17" data-i18n="language">Language</label>
      <div class="seg-row" id="langRow">
        <button data-lang-choice="auto" data-i18n="themeAuto">Auto</button>
        <button data-lang-choice="en">English</button>
        <button data-lang-choice="ja">日本語</button>
      </div>
    </div>
  </div>

  <!-- 複数台で使う -->
  <div class="group">
    <h3 data-icon="swap_horiz" data-icon-size="16" data-i18n="grpMulti">Several machines</h3>
    <label class="toggle" style="margin-bottom:.5rem">
      <input type="checkbox" id="multiOn"><span data-i18n="multiOn">Require this machine's name</span>
    </label>
    <div class="field">
      <label for="machineName" data-icon="short_text" data-icon-size="17" data-i18n="machineName">This machine</label>
      <input class="filter" id="machineName" data-i18n-ph="machineNamePh" style="margin:0">
    </div>
    <p class="range-note" data-i18n="multiNote"></p>
  </div>

  <!-- 辞書 -->
  <div class="group">
    <h3 data-icon="menu_book" data-icon-size="16" data-i18n="grpDict">Dictionary</h3>
    <label class="toggle" style="margin-bottom:.5rem">
      <input type="checkbox" id="scopePrivate"><span data-i18n="dictPrivate">Keep on this machine only</span>
    </label>
    <p class="scope-note" id="scopeNote"></p>

    <div class="dict-tabs" role="tablist">
      <button class="on" id="tabReplace" data-icon="swap_horiz" data-icon-size="17" data-i18n="dictReplace">Replace</button>
      <button id="tabIgnore" data-icon="voice_over_off" data-icon-size="17" data-i18n="dictIgnore">Ignore</button>
    </div>

    <div id="paneReplace">
      <p class="dict-label" data-i18n="dictReplaceHelp"></p>
      <div class="new-row">
        <input id="newFrom" data-i18n-ph="dictHeard">
        <span class="arrow">→</span>
        <input id="newTo" data-i18n-ph="dictSendAs">
        <button class="btn tonal" id="addReplace" data-icon="add" data-icon-size="17" data-i18n="add">Add</button>
      </div>
      <input class="filter" id="filterReplace" data-i18n-ph="dictFilter">
      <div class="rows" id="replaceRows"></div>
    </div>

    <div id="paneIgnore" hidden>
      <p class="dict-label" data-i18n="dictIgnoreHelp"></p>
      <div class="new-row">
        <input id="newIgnore" data-i18n-ph="dictIgnorePh">
        <button class="btn tonal" id="addIgnore" data-icon="add" data-icon-size="17" data-i18n="add">Add</button>
      </div>
      <div class="rows" id="ignoreRows"></div>
      <p class="dict-label builtin-head">
        <span data-i18n="dictBuiltin"></span>（<span id="builtinCount">0</span>）
      </p>
      <div class="chips" id="builtinChips"></div>
    </div>

    <div class="btn-row" style="margin-top:.6rem">
      <button class="btn go" id="dictSave" data-icon="check" data-icon-size="17" data-i18n="save">Save</button>
      <span class="spacer"></span>
      <button class="btn" id="dictExport" data-icon="download" data-icon-size="17" data-i18n="exportCsv">Export CSV</button>
      <button class="btn" id="dictImport" data-icon="upload" data-icon-size="17" data-i18n="importCsv">Import CSV</button>
      <input type="file" id="dictFile" accept=".csv,text/csv" hidden>
    </div>
    <p class="dict-note" id="dictNote"></p>
  </div>

  <!-- ログ -->
  <div class="group">
    <h3 data-icon="list_alt" data-icon-size="16" data-i18n="grpLog">Transcript</h3>
    <div class="btn-row">
      <span class="val" style="margin:0"><span id="count">0</span> <span data-i18n="items">items</span></span>
      <span class="spacer"></span>
      <button class="btn" id="copy" data-icon="content_copy" data-icon-size="17" data-i18n="copyAll">Copy all</button>
    </div>
  </div>
 </div>
</section>

const store = {
  get(k, d) { try { return localStorage.getItem('vs.' + k) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('vs.' + k, v); } catch {} },
};

let langPref = store.get('lang', 'auto');
let lang = 'en';
function resolveLang() {
  lang = langPref !== 'auto' ? langPref
       : ((navigator.language || 'en').toLowerCase().startsWith('ja') ? 'ja' : 'en');
  if (!I18N[lang]) lang = 'en';
  document.documentElement.lang = lang;
}
// {name} のような差し込みも一緒に扱う
const t = (key, vars) => {
  let s = (I18N[lang] && I18N[lang][key]) ?? I18N.en[key] ?? key;
  if (vars) for (const [k, v] of Object.entries(vars)) s = s.replaceAll('{' + k + '}', v);
  return s;
};

function applyI18n(root = document) {
  for (const n of root.querySelectorAll('[data-i18n]')) {
    // アイコンを入れた要素は文字の部分だけ差し替える（svg を消さない）
    const svg = n.querySelector(':scope > svg');
    if (svg) {
      const last = n.lastChild;
      if (last && last.nodeType === 3) last.nodeValue = t(n.dataset.i18n);
      else n.append(t(n.dataset.i18n));
    } else {
      n.textContent = t(n.dataset.i18n);
    }
  }
  for (const n of root.querySelectorAll('[data-i18n-ph]')) n.placeholder = t(n.dataset.i18nPh);
  // 認識中の枠が空のときに出す文字（CSS から content で読む）
  for (const n of root.querySelectorAll('[data-i18n-quiet]')) n.dataset.quiet = t(n.dataset.i18nQuiet);
  for (const n of root.querySelectorAll('[data-i18n-title]')) {
    n.title = t(n.dataset.i18nTitle);
    n.setAttribute('aria-label', t(n.dataset.i18nTitle));
  }
  // 状態で文言が変わるものは data-i18n に載せられないので、ここで塗り直す
  if (typeof paintPower === 'function' && el.powerLabel) paintPower();
}

// 輪郭と塗りを両方入れた svg を作る。どちらを見せるかは CSS が決める。
function iconSvg(name, size = 18) {
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', '0 -960 960 960');
  svg.setAttribute('fill', 'currentColor');
  svg.setAttribute('aria-hidden', 'true');
  svg.style.width = svg.style.height = size + 'px';
  svg.style.flex = 'none';
  const pair = ICON[name] || ICON.auto_awesome;
  for (const [i, cls] of [[0, 'line'], [1, 'solid']]) {
    const path = document.createElementNS(NS, 'path');
    path.setAttribute('d', pair[i]);
    path.setAttribute('class', cls);
    svg.appendChild(path);
  }
  return svg;
}

// data-icon が付いている要素の先頭に絵を入れる。文字だけの画面にしない。
function decorateIcons(root = document) {
  for (const n of root.querySelectorAll('[data-icon]:not([data-iconed])')) {
    n.dataset.iconed = '1';
    n.prepend(iconSvg(n.dataset.icon, Number(n.dataset.iconSize) || 18));
  }
}
